name: Preview Deploy (Cloudflare Pages)

# Auto-deploys the private preview whenever the rebuild branch changes — including
# commits made by the Sveltia CMS at /admin — so uploaded photos and edits appear
# on the preview within a couple of minutes. Preview-only: scoped to the rebuild
# branch, so it never touches main or the public GitHub Pages site.
on:
  push:
    branches: [feat/editorial-rebuild-v5]
  workflow_dispatch:

concurrency:
  group: preview-deploy
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: '0307c39cdbae89269abd387eaa64511d'

jobs:
  deploy:
    name: Build and deploy preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages (preview)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx --yes wrangler@latest pages deploy dist --project-name=km-studio-396752bd --branch=preview --commit-dirty=true

      - name: Note if token missing
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::warning::CLOUDFLARE_API_TOKEN repo secret not set — build succeeded, deploy skipped. Add the secret to enable auto-deploy."
