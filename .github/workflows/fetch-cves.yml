name: Fetch CVE Data

on:
  schedule:
    - cron: '0 6 * * *'    # 08:00 SAST daily
  workflow_dispatch:

jobs:
  fetch:
    name: Fetch CVEs from OSV.dev
    runs-on: [self-hosted, linux, homelab, bran-site]

    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SITE_DEPLOY_TOKEN }}

      - name: Sync stack.json to live cluster versions
        run: python3 scripts/sync-stack-versions.py

      - name: Fetch CVE data
        run: python3 scripts/fetch-cves.py > public/data/cve.json

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/cve.json scripts/stack.json
          git diff --staged --quiet && exit 0
          git commit -m "chore(data): update CVE feed + sync stack versions"
          git pull --rebase
          git push
